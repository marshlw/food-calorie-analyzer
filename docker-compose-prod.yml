version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ai_healthy
      POSTGRES_USER: ai_healthy
      POSTGRES_PASSWORD: ai_healthy_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ai_healthy:ai_healthy_password@db:5432/ai_healthy
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:5000
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost:8000", "http://localhost"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./temp_images:/app/temp_images

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -l info
    environment:
      DATABASE_URL: postgresql://ai_healthy:ai_healthy_password@db:5432/ai_healthy
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:5000
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./temp_images:/app/temp_images

volumes:
  db_data:
