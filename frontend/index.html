<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2b6fe3" />
    <meta name="description" content="Rasify — умный дневник питания с AI-анализом по фото" />
    <title>Rasify — умный дневник питания</title>
    <link rel="manifest" href="/manifest.json" />
    <!-- Фирменный знак 1a: незамкнутое кольцо с точкой-искрой AI -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' stroke='%232b6fe3' stroke-width='10' fill='none' stroke-linecap='round' stroke-dasharray='122.5 163.4' transform='rotate(-90 32 32)'/%3E%3Ccircle cx='13.6' cy='13.6' r='6' fill='%232b6fe3'/%3E%3C/svg%3E"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%232b6fe3' width='192' height='192' rx='42'/%3E%3Ccircle cx='96' cy='96' r='58' stroke='%23ffffff' stroke-width='22' fill='none' stroke-linecap='round' stroke-dasharray='273 364' transform='rotate(-90 96 96)'/%3E%3Ccircle cx='55' cy='55' r='13' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <!-- Шрифты дизайн-системы: Manrope (заголовки/цифры) + Golos Text (интерфейс) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Тема до рендера — чтобы тёмная тема не «мигала» светлой -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
