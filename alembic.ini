# Alembic configuration.
#
# Схема БД теперь версионируется через Alembic. Команды запускаются из корня
# проекта внутри контейнера api (там установлен alembic и доступен .env):
#
#   docker compose -f docker-compose.prod.yml exec api alembic upgrade head
#   docker compose -f docker-compose.prod.yml exec api alembic revision --autogenerate -m "..."
#
# URL БД НЕ хранится здесь — он берётся из настроек приложения (settings.DATABASE_URL,
# то есть из .env / секретов). См. alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# Формат имени файла ревизии: <дата>_<slug>_<rev>.py — удобно сортируется.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s_%%(rev)s
timezone = UTC

# sqlalchemy.url намеренно пуст: реальный URL подставляется в env.py из
# settings.DATABASE_URL, чтобы не дублировать секрет в конфиге.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
