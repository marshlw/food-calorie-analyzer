# Прод-конфигурация. Запуск:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Отличия от dev (docker-compose.yml):
#  - нет ollama/ollama-pull/gradio (используется облачный Yandex API)
#  - нет --reload и монтирования исходников (код берётся из образа)
#  - порты postgres/redis НЕ выставлены наружу (доступ только внутри сети)
#  - наружу смотрит только Caddy (80/443) с авто-HTTPS
#  - uploads и данные БД — на именованных volume'ах

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpass}
      POSTGRES_DB: fooddb
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  api:
    build: .
    image: ai-healthy:latest
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - uploads_data:/app/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  celery_worker:
    image: ai-healthy:latest
    working_dir: /app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - uploads_data:/app/app/uploads
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # Опционально: Telegram-бот. Если не нужен — закомментируй блок.
  telegram_bot:
    image: ai-healthy:latest
    working_dir: /app
    command: python -m app.telegram_bot
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
