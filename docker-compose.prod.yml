# ──────────────────────────────────────────────────────────────────────────
# PROD — раскатка на арендованной ВМ. Запуск:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Безопасность / отличия от dev:
#  - НАРУЖУ торчит только Caddy (80/443, авто-HTTPS). Больше ни одного ports:
#    postgres/redis/api без published-портов из интернета недостижимы,
#    при этом исходящий доступ (Yandex API, Telegram) у сервисов остаётся
#  - caddy видит api через отдельную сеть web, к БД доступа не имеет
#  - рекомендация на ВМ: firewall (ufw/облачный) — разрешить только 22/80/443
#  - нет ollama/gradio (MODEL_PROVIDER=yandex, облачный API)
#  - нет --reload и монтирования исходников — код только из образа
#  - логи ограничены (json-file 10m x3), контейнеры без права эскалации
#    привилегий (no-new-privileges)
#  - у api healthcheck на /health; celery/bot/caddy стартуют только
#    после здорового api
#
# Доступ к БД для администрирования (порт не публикуем):
#   на ВМ:  docker compose -f docker-compose.prod.yml exec postgres psql -U postgres fooddb
#   из DBeaver: временно добавь в postgres `ports: ["127.0.0.1:5433:5432"]`
#   и подключайся через SSH-туннель: ssh -L 5433:127.0.0.1:5433 user@vm
# ──────────────────────────────────────────────────────────────────────────
name: ai-healthy-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:

  postgres:
    image: postgres:15
    <<: *hardening
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpass}
      POSTGRES_DB: fooddb
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fooddb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    <<: *hardening
    # appendonly — чтобы очередь celery переживала рестарт контейнера
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build: .
    image: ai-healthy:prod
    <<: *hardening
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'
    volumes:
      - uploads_data:/app/app/uploads
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - web

  celery_worker:
    image: ai-healthy:prod
    <<: *hardening
    working_dir: /app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - uploads_data:/app/app/uploads
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend

  # Telegram-бот. Если не нужен — закомментируй блок.
  telegram_bot:
    image: ai-healthy:prod
    <<: *hardening
    working_dir: /app
    command: python -m app.telegram_bot
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    <<: *hardening
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  # Порты backend-сервисов не публикуются → из интернета они недостижимы.
  # internal: true здесь НЕ используем: celery и telegram_bot должны ходить
  # наружу (Yandex API, api.telegram.org).
  backend:
    driver: bridge
  web:
    driver: bridge
