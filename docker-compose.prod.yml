# ──────────────────────────────────────────────────────────────────────────
# PROD — раскатка на арендованной ВМ. Запуск:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Безопасность / отличия от dev:
#  - НАРУЖУ торчит только Caddy (80/443, авто-HTTPS). Больше ни одного ports:
#    postgres/redis/api без published-портов из интернета недостижимы,
#    при этом исходящий доступ (Yandex API, Telegram) у сервисов остаётся
#  - caddy видит api через отдельную сеть web, к БД доступа не имеет
#  - рекомендация на ВМ: firewall (ufw/облачный) — разрешить только 22/80/443
#  - нет ollama/gradio (MODEL_PROVIDER=yandex, облачный API)
#  - нет --reload и монтирования исходников — код только из образа
#  - логи ограничены (json-file 10m x3), контейнеры без права эскалации
#    привилегий (no-new-privileges)
#  - у api healthcheck на /health; celery/bot/caddy стартуют только
#    после здорового api
#
# Доступ к БД для администрирования (порт не публикуем):
#   на ВМ:  docker compose -f docker-compose.prod.yml exec postgres psql -U postgres fooddb
#   из DBeaver: временно добавь в postgres `ports: ["127.0.0.1:5433:5432"]`
#   и подключайся через SSH-туннель: ssh -L 5433:127.0.0.1:5433 user@vm
# ──────────────────────────────────────────────────────────────────────────
name: ai-healthy-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:

  postgres:
    image: postgres:15
    <<: *hardening
    # Бюджет коннектов при DB_POOL_SIZE=5 / DB_MAX_OVERFLOW=5:
    #   api    2 воркера  * 10 = 20
    #   celery 4 процесса * 10 = 40
    #   + psql/бэкапы/мониторинг
    # Дефолтных 100 хватает впритык, поднимаем до 150 с запасом. Выше на ВМ с
    # 2 ГБ RAM нет смысла: каждый backend Postgres — это отдельный процесс.
    # При 5000 DAU правильное решение — PgBouncer в режиме transaction.
    command: postgres -c max_connections=150
    environment:
      POSTGRES_USER: postgres
      # Пароли обязательны и приходят из окружения/секретов. `:?` заставляет
      # compose упасть с понятной ошибкой, если переменная не задана — это
      # убирает прежний слабый дефолт adminpass.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — put a strong value in .env}
      POSTGRES_DB: fooddb
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Пароль прикладного пользователя fooduser (его использует api в DATABASE_URL).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required — put a strong value in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fooddb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    <<: *hardening
    # appendonly — чтобы очередь celery переживала рестарт контейнера.
    # requirepass (M-3): в Redis лежат очередь Celery, кэш анализа, счётчики
    # rate-limit и учёт активных refresh-токенов. Одной сетевой изоляции мало —
    # любая ошибка в конфигурации сети открывает обход брутфорс-защиты.
    # ВАЖНО: тот же пароль должен быть в REDIS_URL и CELERY_BROKER_URL/
    # CELERY_RESULT_BACKEND в .env, формат: redis://:ПАРОЛЬ@redis:6379/0
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required — put a strong value in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      # -a обязателен: без пароля redis-cli ping вернёт NOAUTH, и контейнер
      # навсегда останется unhealthy — api и celery не стартуют.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Одноразовый контейнер: накатывает схему и готовит справочные данные,
  # ПОСЛЕ чего завершается. api и celery ждут его успешного выхода.
  # Раньше всё это делал startup-хук каждого воркера — с гонкой на DDL и
  # блокировками живых таблиц при каждом деплое (H-7).
  # restart: "no" — переопределяем общий unless-stopped из &hardening,
  # иначе compose перезапускал бы завершившийся контейнер по кругу.
  migrate:
    build: .
    image: ai-healthy:prod
    working_dir: /app
    command: sh -c "alembic upgrade head && python -m app.bootstrap"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build: .
    image: ai-healthy:prod
    <<: *hardening
    working_dir: /app
    # --forwarded-allow-ips: ТОЛЬКО статический IP caddy в сети web.
    # С '*' uvicorn переписывал request.client.host любым присланным
    # X-Forwarded-For ещё до нашего кода — вся brute-force защита и лимиты
    # по IP обходились подстановкой случайного заголовка.
    # uvicorn 0.27 сравнивает адреса строкой, CIDR не поддерживает,
    # поэтому IP caddy зафиксирован в сети web (см. networks внизу файла).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '172.29.0.10'
    volumes:
      - uploads_data:/app/app/uploads
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - web

  # Анализ фото. Слушает ТОЛЬКО очереди analyze и maintenance: тяжёлый
  # ретрейн (очередь retrain) не должен занимать слоты, в которых
  # пользователи ждут результат анализа.
  #
  # ПОЧЕМУ --pool=threads, а не префорк:
  # задача на 95% состоит из ожидания ответа Yandex Vision (20-45 с), CPU
  # почти не нужен. Префорк с concurrency=6 — это 6 полных процессов Python
  # с Pillow, ~120 МБ каждый ещё до первой картинки: на ВМ с 2 ГБ RAM это не
  # помещается рядом с Postgres и api. Потоки живут в одном процессе и делят
  # память, поэтому concurrency=8 стоит дешевле, чем префорк на 4.
  # Бонус: 8 потоков берут 8 коннектов из ОДНОГО пула (5+5), а 6 префорк-
  # процессов держали бы 6 отдельных пулов = до 60 коннектов к Postgres.
  #
  # ЧЕМ ПЛАТИМ: пул потоков не поддерживает task_time_limit/soft_time_limit
  # (их реализация в celery опирается на сигналы префорка) и
  # --max-tasks-per-child. Зависнуть насмерть задача всё же не может:
  # у httpx-клиента жёсткий таймаут MODEL_TIMEOUT_SECONDS, а размер картинки
  # ограничен MAX_IMAGE_PIXELS. Утечки памяти ловит mem_limit + restart.
  #
  # Очередь retrain намеренно НИКЕМ не слушается: ретрейн выключен
  # (RETRAIN_ENABLED=false, в образе нет ollama), задачи в неё не кладутся.
  # Включаете ретрейн — поднимайте отдельный воркер с `-Q retrain`.
  celery_worker:
    image: ai-healthy:prod
    <<: *hardening
    working_dir: /app
    command: celery -A app.celery_app worker --loglevel=info -Q analyze,maintenance --pool=threads --concurrency=8
    mem_limit: 700m
    volumes:
      - uploads_data:/app/app/uploads
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend

  # Планировщик: ночная уборка тома uploads (см. celery_app.beat_schedule).
  # Ровно ОДИН экземпляр — иначе задачи будут дублироваться.
  celery_beat:
    image: ai-healthy:prod
    <<: *hardening
    working_dir: /app
    command: celery -A app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    mem_limit: 200m
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - backend

  # Telegram-бот временно выключен (экономия ~150 МБ RAM на ВМ 2 ГБ).
  # Чтобы вернуть — раскомментируй блок ниже.
  # telegram_bot:
  #   image: ai-healthy:prod
  #   <<: *hardening
  #   working_dir: /app
  #   command: python -m app.telegram_bot
  #   env_file:
  #     - .env
  #   environment:
  #     - API_URL=http://api:8000
  #     - PYTHONPATH=/app
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - backend

  caddy:
    image: caddy:2-alpine
    <<: *hardening
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      web:
        # Статический IP: его же указываем в --forwarded-allow-ips у api,
        # чтобы uvicorn доверял X-Forwarded-For только от нашего reverse-proxy.
        ipv4_address: 172.29.0.10

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  # Порты backend-сервисов не публикуются → из интернета они недостижимы.
  # internal: true здесь НЕ используем: celery и telegram_bot должны ходить
  # наружу (Yandex API, api.telegram.org).
  backend:
    driver: bridge
  # Подсеть web зафиксирована, чтобы caddy получал предсказуемый IP
  # (нужен для --forwarded-allow-ips у api).
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
