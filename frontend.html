<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Healthy - Анализатор калорий по фото</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Авторизация -->
        <div id="authSection" class="auth-section">
            <h1>🍽️ AI Healthy</h1>
            <p style="text-align: center; color: #718096; margin-bottom: 30px;">Анализатор калорий по фото еды</p>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" placeholder="Введите пароль" required>
            </div>

            <button id="loginBtn" class="btn">Войти</button>
            <button id="regBtn" class="btn btn-secondary">Зарегистрироваться</button>

            <div id="authMessage"></div>
        </div>

        <!-- Личный кабинет -->
        <div id="dashboardSection" class="dashboard-section" style="display: none;">
            <h2>Личный кабинет</h2>

            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('analyze')">Анализ</button>
                <button class="tab-btn" onclick="showTab('history')">История</button>
            </div>

            <!-- Вкладка анализа -->
            <div id="analyzeTab" class="tab-content active">
                <div class="upload-area" onclick="document.getElementById('photo').click()">
                    <div id="uploadContent">
                        <div class="upload-text">📸 Загрузите фото тарелки</div>
                        <div class="upload-subtext">Нажмите или перетащите файл сюда</div>
                    </div>
                </div>
                <input type="file" id="photo" accept="image/*" style="display: none;">

                <button id="analyzeBtn" class="btn" disabled>🔍 Проанализировать</button>

                <div id="analyzeResult"></div>
            </div>

            <!-- Вкладка истории -->
            <div id="historyTab" class="tab-content">
                <button id="loadHistoryBtn" class="btn btn-secondary" onclick="loadHistory()">Обновить историю</button>
                <div id="historyList" class="history-list"></div>
            </div>

            <button id="logoutBtn" class="btn btn-secondary" style="margin-top: 30px;">Выйти</button>
        </div>
    </div>

    <script>
        let token = null;
        let currentUser = null;

        // Показать вкладку
        function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            document.querySelector(`[onclick="showTab('${tabName}')"]`).classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        // Показать сообщение
        function showMessage(elementId, message, type = 'error') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${type}-message">${message}</div>`;
            setTimeout(() => element.innerHTML = '', 5000);
        }

        // Авторизация
        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('authMessage', 'Заполните все поля');
                return;
            }

            try {
                // Сначала пытаемся зарегистрироваться (если уже есть – получим ошибку, но продолжим)
                await fetch('http://localhost:8000/api/v1/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password, full_name: email})
                }).catch(e => console.log('Регистрация не нужна'));

                // Логинимся
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const resp = await fetch('http://localhost:8000/api/v1/token', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData
                });

                if (resp.ok) {
                    const data = await resp.json();
                    token = data.access_token;
                    currentUser = {email};

                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('dashboardSection').style.display = 'block';
                    document.getElementById('analyzeBtn').disabled = false;

                    showMessage('analyzeResult', '✅ Авторизация успешна! Теперь можно загружать фото.', 'success');
                    loadHistory(); // Загружаем историю при входе
                } else {
                    const error = await resp.json();
                    showMessage('authMessage', error.detail || 'Ошибка входа');
                }
            } catch (error) {
                showMessage('authMessage', 'Ошибка сети');
            }
        };

        // Регистрация (отдельная кнопка, но логика та же)
        document.getElementById('regBtn').onclick = () => {
            document.getElementById('loginBtn').click();
        };

        // Анализ фото
        document.getElementById('analyzeBtn').onclick = async () => {
            const fileInput = document.getElementById('photo');
            const file = fileInput.files[0];

            if (!file) {
                showMessage('analyzeResult', 'Выберите фото для анализа');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('analyzeBtn').innerHTML = '⏳ Анализируем...';

            try {
                const resp = await fetch('http://localhost:8000/api/v1/analyze', {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${token}`},
                    body: formData
                });

                if (resp.ok) {
                    const task = await resp.json();
                    document.getElementById('analyzeResult').innerHTML = `
                        <div class="loading">🔄 Анализ запущен (ID: ${task.id}). Ожидайте результат...</div>
                    `;

                    // Опрашиваем статус каждые 2 секунды
                    const interval = setInterval(async () => {
                        try {
                            const statusResp = await fetch(`http://localhost:8000/api/v1/task/${task.id}`, {
                                headers: {'Authorization': `Bearer ${token}`}
                            });
                            const status = await statusResp.json();

                            if (status.status === 'success') {
                                clearInterval(interval);
                                const r = status.result;
                                document.getElementById('analyzeResult').innerHTML = `
                                    <div class="result-card">
                                        <div class="result-title">🍽️ Результат анализа</div>
                                        <div class="result-item">
                                            <span class="result-label">Блюдо:</span>
                                            <span class="result-value">${r.food}</span>
                                        </div>
                                        <div class="result-item">
                                            <span class="result-label">Вес:</span>
                                            <span class="result-value">${r.weight_g} г</span>
                                        </div>
                                        <div class="result-item">
                                            <span class="result-label">Калории:</span>
                                            <span class="result-value">${r.calories} ккал</span>
                                        </div>
                                        <div class="result-item">
                                            <span class="result-label">Белки:</span>
                                            <span class="result-value">${r.protein_g} г</span>
                                        </div>
                                        <div class="result-item">
                                            <span class="result-label">Жиры:</span>
                                            <span class="result-value">${r.fat_g} г</span>
                                        </div>
                                        <div class="result-item">
                                            <span class="result-label">Углеводы:</span>
                                            <span class="result-value">${r.carbs_g} г</span>
                                        </div>
                                    </div>
                                `;
                                loadHistory(); // Обновляем историю после анализа
                            } else if (status.status === 'error') {
                                clearInterval(interval);
                                document.getElementById('analyzeResult').innerHTML = `
                                    <div class="error-message">❌ Ошибка анализа: ${status.error || 'Неизвестная ошибка'}</div>
                                `;
                            }
                        } catch (error) {
                            clearInterval(interval);
                            document.getElementById('analyzeResult').innerHTML = `
                                <div class="error-message">❌ Ошибка при получении результата</div>
                            `;
                        }
                    }, 2000);
                } else {
                    const error = await resp.json();
                    showMessage('analyzeResult', `Ошибка: ${error.detail || 'Не удалось запустить анализ'}`);
                }
            } catch (error) {
                showMessage('analyzeResult', 'Ошибка сети');
            } finally {
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('analyzeBtn').innerHTML = '🔍 Проанализировать';
            }
        };

        // Загрузка истории
        async function loadHistory() {
            if (!token) return;

            document.getElementById('historyList').innerHTML = '<div class="loading">Загружаем историю...</div>';

            try {
                const resp = await fetch('http://localhost:8000/api/v1/tasks?limit=20', {
                    headers: {'Authorization': `Bearer ${token}`}
                });

                if (resp.ok) {
                    const tasks = await resp.json();

                    if (tasks.length === 0) {
                        document.getElementById('historyList').innerHTML = '<p style="text-align: center; color: #718096; padding: 40px;">История анализов пуста</p>';
                        return;
                    }

                    const historyHtml = tasks.map(task => {
                        let statusClass = 'status-pending';
                        let statusText = 'Ожидание';

                        if (task.status === 'success') {
                            statusClass = 'status-success';
                            statusText = 'Готово';
                        } else if (task.status === 'failure') {
                            statusClass = 'status-error';
                            statusText = 'Ошибка';
                        }

                        const date = new Date(task.created_at).toLocaleString('ru-RU');

                        let resultHtml = '';
                        if (task.result) {
                            resultHtml = `
                                <div style="margin-top: 10px; padding: 10px; background: #f0f4f8; border-radius: 5px;">
                                    <strong>${task.result.food}</strong> - ${task.result.calories} ккал, ${task.result.weight_g} г
                                </div>
                            `;
                        } else if (task.error) {
                            resultHtml = `<div style="margin-top: 10px; color: #e53e3e;">Ошибка: ${task.error}</div>`;
                        }

                        return `
                            <div class="history-item">
                                <div class="history-date">${date}</div>
                                <div class="history-status ${statusClass}">${statusText}</div>
                                ${resultHtml}
                            </div>
                        `;
                    }).join('');

                    document.getElementById('historyList').innerHTML = historyHtml;
                } else {
                    document.getElementById('historyList').innerHTML = '<div class="error-message">Не удалось загрузить историю</div>';
                }
            } catch (error) {
                document.getElementById('historyList').innerHTML = '<div class="error-message">Ошибка сети</div>';
            }
        }

        // Выход
        document.getElementById('logoutBtn').onclick = () => {
            token = null;
            currentUser = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('photo').value = '';
            document.getElementById('analyzeResult').innerHTML = '';
            document.getElementById('historyList').innerHTML = '';
            document.getElementById('uploadContent').innerHTML = `
                <div class="upload-text">📸 Загрузите фото тарелки</div>
                <div class="upload-subtext">Нажмите или перетащите файл сюда</div>
            `;
        };

        // Drag and drop для загрузки фото
        const uploadArea = document.querySelector('.upload-area');
        const fileInput = document.getElementById('photo');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                // Используем DataTransfer для установки файлов в input
                const dt = new DataTransfer();
                dt.items.add(files[0]);
                fileInput.files = dt.files;
                // Вызываем change event
                fileInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
        });

        // Обновление состояния кнопки анализа при выборе файла и отображение превью
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            const uploadContent = document.getElementById('uploadContent');
            
            if (file) {
                // Отображаем превью
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadContent.innerHTML = `
                        <img src="${e.target.result}" style="max-width: 100%; max-height: 300px; border-radius: 8px;">
                        <div class="upload-text" style="margin-top: 10px;">✅ Фото загружено: ${file.name}</div>
                    `;
                };
                reader.readAsDataURL(file);
                
                // Включаем кнопку анализа
                document.getElementById('analyzeBtn').disabled = false;
                console.log('Файл загружен:', file.name);
            } else {
                // Восстанавливаем исходное содержимое
                uploadContent.innerHTML = `
                    <div class="upload-text">📸 Загрузите фото тарелки</div>
                    <div class="upload-subtext">Нажмите или перетащите файл сюда</div>
                `;
                document.getElementById('analyzeBtn').disabled = true;
            }
        });
    </script>
</body>
</html>
