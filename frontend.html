<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор калорий по фото</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; }
        input, button { margin: 10px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        #result { background: #f0f0f0; padding: 15px; border-radius: 8px; white-space: pre-wrap; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>🍽️ Анализ еды по фото</h1>

    <label>Email:</label>
    <input type="email" id="email" placeholder="example@mail.ru">

    <label>Пароль:</label>
    <input type="password" id="password" placeholder="******">

    <button id="loginBtn">Войти</button>
    <button id="regBtn">Зарегистрироваться</button>
    <hr>

    <label>Загрузите фото тарелки:</label>
    <input type="file" id="photo" accept="image/*">
    <button id="analyzeBtn" disabled>Анализировать</button>

    <div id="result"></div>

    <script>
        let token = null;

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Пытаемся зарегистрироваться (если уже есть – получим ошибку, но продолжим)
            await fetch('/api/v1/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password, full_name: email})
            }).catch(e => console.log('Регистрация не нужна, возможно уже есть'));

            // Логинимся
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            const resp = await fetch('/api/v1/token', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: formData
            });

            if (resp.ok) {
                const data = await resp.json();
                token = data.access_token;
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('result').innerHTML = '✅ Авторизован! Теперь можно загружать фото.';
            } else {
                alert('Ошибка входа');
            }
        };

        document.getElementById('analyzeBtn').onclick = async () => {
            const file = document.getElementById('photo').files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const resp = await fetch('/api/v1/analyze', {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`},
                body: formData
            });

            const task = await resp.json();
            document.getElementById('result').innerHTML = `🔄 Задача создана (ID: ${task.id}). Ждём результат...`;

            // Опрашиваем статус каждые 2 секунды
            const interval = setInterval(async () => {
                const statusResp = await fetch(`/api/v1/task/${task.id}`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                const status = await statusResp.json();
                if (status.status === 'success') {
                    clearInterval(interval);
                    const r = status.result;
                    document.getElementById('result').innerHTML = `
                        <h3>Результат анализа:</h3>
                        <b>🍲 Блюдо:</b> ${r.food}<br>
                        <b>⚖️ Вес:</b> ${r.weight_g} г<br>
                        <b>🔥 Калории:</b> ${r.calories} ккал<br>
                        <b>🥩 Белки:</b> ${r.protein_g} г<br>
                        <b>🧈 Жиры:</b> ${r.fat_g} г<br>
                        <b>🍚 Углеводы:</b> ${r.carbs_g} г<br>
                        ${r.confidence ? `<b>📊 Уверенность:</b> ${r.confidence}` : ''}
                    `;
                } else if (status.status === 'failure') {
                    clearInterval(interval);
                    document.getElementById('result').innerHTML = `❌ Ошибка: ${status.error}`;
                }
            }, 2000);
        };
    </script>
</body>
</html>
