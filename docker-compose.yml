services:

  postgres:
    image: postgres:15
    command: postgres -c listen_addresses='*'
    environment:
      POSTGRES_USER: postgres          # суперпользователь для администрирования
      POSTGRES_PASSWORD: adminpass     # пароль суперпользователя
      POSTGRES_DB: fooddb              # база данных по умолчанию
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
#      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=${MODEL_NAME:-llava:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be fully ready..."
        sleep 5
        echo "Pulling model $MODEL_NAME..."
        ollama pull $MODEL_NAME
        echo "Model $MODEL_NAME pulled successfully."
    restart: "no"
    networks:
      - backend

  api:
    build: .
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app:delegated
      - ./app/app/uploads:/app/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend

  celery_worker:
    build: .
    working_dir: /app
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./:/app:delegated
      - ./app/app/uploads:/app/app/uploads
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - C_FORCE_ROOT=true
    depends_on:
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  telegram_bot:
    build: .
    working_dir: /app
    command: python -m app.telegram_bot
    volumes:
      - ./:/app:delegated
      - ./app/app/uploads:/app/app/uploads
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  gradio:
    build: .
    working_dir: /app
    command: python -m app.gradio_app
    volumes:
      - ./:/app:delegated
      - ./app/app/uploads:/app/app/uploads
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  ollama_data:

networks:
  backend:
    driver: bridge