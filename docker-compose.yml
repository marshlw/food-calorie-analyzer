version: '3.9'

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
      POSTGRES_DB: fooddb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/app
      - ./app/app/uploads:/app/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - postgres
      - redis
      - ollama

  celery:
    build: .
    command: celery -A app.tasks worker --loglevel=info
    volumes:
      - ./app:/app
      - ./app/app/uploads:/app/app/uploads
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - redis
      - ollama
      - api

  telegram_bot:
    build: .
    command: python telegram_bot.py
    volumes:
      - ./app:/app
      - ./app/app/uploads:/app/app/uploads
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  gradio:
    build: .
    command: python -m app.gradio_app
    volumes:
      - ./app:/app
      - ./app/app/uploads:/app/app/uploads
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data: